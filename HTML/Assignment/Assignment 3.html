<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons</title>
</head>

<body>
    <style>
        .BackToAmazon-button {
            border: none;
            color: rgb(0, 113, 133);
            background-color: white;
        }

        h4 {
            color: rgb(0, 118, 0);
        }

        .AddtoCart-button {
            height: 30px;
            width: 120px;
            color: black;
            border-radius: 30px;
            background-color: rgb(255, 216, 20);
            border: none;
        }

        .BuyNow-Button {
            height: 30px;
            width: 120px;
            color: black;
            border-radius: 30px;
            background-color: rgb(255, 164, 28);
            border: none;
        }
    </style>
    <Button class="BackToAmazon-button">
        <a href="https://www.amazon.in/" target="_blank"> Back To Amazon</a>
    </Button>
    <h1><strong> Nike Black Running Shoes</strong></h1>
    <h4><strong>$39 - In Stock</strong></h4>

    <p>Free Delivery Tommorow</p>
    <button class="AddtoCart-button">
        Add to Cart
    </button>
    <button class="BuyNow-Button">
        Buy Now
    </button>
</body>

</html>
