<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .RequestNow-button {
            border: none;
            color: rgb(0, 113, 133);
            background-color: black;
            color: white;
            height: 40px;
            width: 100px;
            cursor: pointer;

        }

        h4 {
            color: rgb(0, 118, 0);
        }

        .AddtoCart-button {
            height: 30px;
            width: 120px;
            color: black;
            border-radius: 30px;
            background-color: rgb(255, 216, 20);
            border: none;
            cursor: pointer;
        }

        .Signup-button {
            height: 30px;
            width: 80px;
            color: white;
            border-radius: 5px;
            background-color: rgb(46, 164, 79);
            border: none;
            cursor: pointer;
        }

        .getstarted-button {
            height: 35px;
            width: 100px;
            color: black;
            border-radius: 4px;
            background-color: rgb(121, 82, 179);
            border: none;
            color: white;
            cursor: pointer;

        }

        .Download-button {
            height: 35px;
            width: 100px;
            color: black;
            border-color: rgb(108, 117, 125);
            background-color: white;
            color: rgb(108, 117, 125);
            cursor: pointer;

        }

        .Applyoncompanywebsite-button {
            height: 35px;
            width: 200px;
            color: black;
            border-radius: 30px;
            background-color: rgb(10, 102, 194);
            border: none;
            color: white;
            cursor: pointer;

        }

        .Save-button {
            height: 30px;
            width: 80px;
            color: rgb(10, 102, 194);
            border-radius: 0px;
            background-color: white;
            border-color: rgb(10, 102, 194);
            cursor: pointer;

        }
    </style>
    <Button class="RequestNow-button">
        Request Now
    </Button>

    <button class="AddtoCart-button">
        Add to Cart
    </button>
    <button class="Signup-button">
        Signup
    </button>
    <button class="getstarted-button">
        Get Started
    </button>
    <button class="Download-button">
        Download
    </button>
    <button class="Applyoncompanywebsite-button">
        Apply on company website
    </button>
    <button class="Save-button">
        Save
    </button>
</body>

</html>
