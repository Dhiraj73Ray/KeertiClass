<style>
    .subs-button {
        /* css Selectors */
        background-color: rgb(245, 67, 67);
        border: none;
        height: 34px;
        width: 100px;
        color: white;
        font-size: 15px;
        text-transform: uppercase;`
        transition: background-color 0.2s, box-shadow 0.2s;

    }

    .subs-button:hover {
        /* Psuedo Classes */
        background-color: rgb(245, 67, 67, 0.7);
        box-shadow: 3px 2px 5px rgba(85, 85, 85, 0.76);
    }

    .subs-button:active {
        /* Psuedo Classes */
        background-color: rgb(245, 67, 67, 0.4);
    }

    .join-button {
        background-color: white;
        border-color: rgb(31, 203, 255);
        border-style: solid;
        border-width: 1px;
        height: 34px;
        width: 60px;
        font-size: 15px;
        color: rgb(31, 203, 255);
        text-transform: uppercase;
        cursor: pointer;
    }

    .join-button:hover {
        background-color: rgb(31, 203, 255);
        color: white;
    }


    .tweet-button {
        height: 34px;
        width: 75px;
        color: white;
        border-radius: 18px;
        background-color: rgb(96, 207, 252);
        border: none;
        font-size: 15px;
        text-transform: uppercase;
        font-weight: bold;
    }
</style>


<button class="subs-button">
    Subscribe
</button>

<button class="join-button">
    Join
</button>

<button class="tweet-button">
    Tweet
</button>
